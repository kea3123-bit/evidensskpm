name: Verify SKAS frontend
on:
  push:
    branches: [main, feat/skas-2026-eviden-audit, feat/apps-script-backend-2026]
  pull_request:
    branches: [main]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/skas-smoke.test.mjs apps-script/backend.test.mjs apps-script/diagnostics.test.mjs apps-script/authorize.test.mjs
